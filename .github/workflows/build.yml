name: build-and-release

# Builds the .exe and publishes it as a GitHub Release whenever code is pushed
# to main. The release tag is taken from __version__ in the package, so bump
# that version when you want installed copies to auto-update.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(python -c "import activity_logger; print(activity_logger.__version__)")" >> "$GITHUB_OUTPUT"

      - name: Bake in the client data-repo token
        shell: bash
        # Overwrites the committed (empty) placeholder with the real secret,
        # only inside this ephemeral build — never committed back to the repo.
        # If the secret isn't set, the placeholder stays empty and the built
        # .exe simply runs with central sync disabled (same as a dev build).
        run: |
          cat > activity_logger/_embedded.py <<EOF
          CLIENT_DATA_TOKEN = "${{ secrets.CLIENT_DATA_TOKEN }}"
          EOF

      - name: Build logger exe (for employee machines)
        run: pyinstaller --onefile --noconsole --name MAN_inspection main.py

      - name: Build admin console exe (admin only)
        run: pyinstaller --onefile --noconsole --name MAN_inspection_admin admin.py

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: MAN_inspection v${{ steps.ver.outputs.version }}
          files: |
            dist/MAN_inspection.exe
            dist/MAN_inspection_admin.exe
          fail_on_unmatched_files: true
